version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: aquatrack-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: water_billing_db
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - aquatrack-network
    restart: unless-stopped

  backend:
    build:
      context: ./water
      dockerfile: Dockerfile
    container_name: aquatrack-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/water_billing_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
    networks:
      - aquatrack-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aquatrack-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - aquatrack-network
    restart: unless-stopped

volumes:
  mysqldata:

networks:
  aquatrack-network:
    driver: bridge
